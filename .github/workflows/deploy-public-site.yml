name: Deploy public site and Flutter Web to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "public_site/**"
      - "mobile_app/**"
      - ".github/workflows/deploy-public-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_ANON_KEY" || (echo "Missing SUPABASE_ANON_KEY secret" && exit 1)

      - name: Install mobile_app dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build mobile_app Flutter Web
        working-directory: mobile_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build web --release \
            --base-href "/solar_pro/app/" \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" \
            --dart-define="LEGAL_BASE_URL=https://202510010022-prog.github.io/solar_pro"

      - name: Assemble GitHub Pages artifact
        run: |
          rm -rf pages_dist
          mkdir -p pages_dist/app
          cp -R public_site/. pages_dist/
          cp -R mobile_app/build/web/. pages_dist/app/
          touch pages_dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages_dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
